<!DOCTYPE html>
<html>
<head>
    <style>
        body { height: 300vh; background: #222; margin: 0; }
        canvas { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); max-width: 100vw; max-height: 100vh; }
    </style>
</head>
<body>
    <canvas id="hero-lightpass"></canvas>

    <script>
        const canvas = document.getElementById("hero-lightpass");
        const context = canvas.getContext("2d");

        canvas.width = 1080; // Match your video width
        canvas.height = 1080; // Match your video height

        const frameCount = 80; // Change this to your total number of images
        const currentFrame = index => (
            `https://raw.githubusercontent.com/YOUR_USERNAME/my-house-portfolio/main/images/frame_${index}.jpg`
        );

        const images = [];
        const house = { frame: 0 };

        for (let i = 1; i <= frameCount; i++) {
            const img = new Image();
            img.src = currentFrame(i);
            images.push(img);
        }

        window.addEventListener('scroll', () => {  
            const scrollTop = html.scrollTop;
            const maxScrollTop = html.scrollHeight - window.innerHeight;
            const scrollFraction = scrollTop / maxScrollTop;
            const frameIndex = Math.min(frameCount - 1, Math.floor(scrollFraction * frameCount));
            
            render(frameIndex);
        });

        const render = (index) => {
            context.drawImage(images[index], 0, 0);
        };

        images[0].onload = () => render(0);
    </script>
</body>
</html>
